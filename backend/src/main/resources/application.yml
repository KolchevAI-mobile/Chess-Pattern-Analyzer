server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: chess-pattern-backend
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chess}
    username: ${DB_USER:chess}
    password: ${DB_PASSWORD:chess}
  jpa:
    open-in-view: false
    hibernate:
      # Схему создаёт Flyway; Hibernate только проверяет соответствие.
      ddl-auto: validate
  flyway:
    enabled: true

app:
  version: 0.1.0
  # Адрес ML-ядра (Python/FastAPI).
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8000}
  # Версия методики разбора: при смене формулы старые разборы пересчитываются.
  analysis-version: "1"
  # Потолок импорта за один запрос (больше — очередь, веха M2).
  import-limit: 20
  # Глубина Stockfish; в ML дополнительно зажата MAX_DEPTH=10.
  analysis-depth: 10

logging:
  level:
    root: INFO
    com.chesspattern: DEBUG
