server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: chess-pattern-backend
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chess}
    username: ${DB_USER:chess}
    password: ${DB_PASSWORD:chess}
  jpa:
    open-in-view: false
    hibernate:
      # Схему создаёт Flyway; Hibernate только проверяет соответствие.
      ddl-auto: validate
  flyway:
    enabled: true

app:
  version: 0.1.0
  # Адрес ML-ядра (Python/FastAPI). Пока не используется — появится в M2 вместе
  # с очередью заданий на анализ.
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8000}

logging:
  level:
    root: INFO
    com.chesspattern: DEBUG
